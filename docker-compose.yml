services:
  mysql:
    image: mysql:8.4
    container_name: bespoke-mysql
    restart: unless-stopped
    command: --mysql-native-password=ON
    environment:
      MYSQL_DATABASE: bespoke
      MYSQL_USER: bespoke_app
      MYSQL_PASSWORD: bespoke_dev_password
      MYSQL_ROOT_PASSWORD: bespoke_local_root_password
    ports:
      - "127.0.0.1:${BESPOKE_MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - bespoke_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 10

volumes:
  bespoke_mysql:
