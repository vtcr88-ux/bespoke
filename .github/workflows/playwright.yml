name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Prepare test environment
      shell: bash
      run: |
        mkdir -p storage/bespoke-local/uploads storage/control-plane
        ADMIN_PASSWORD_HASH=$(node --input-type=module -e 'import { randomBytes, scryptSync } from "node:crypto"; const salt = randomBytes(16); const key = scryptSync("ci-test-password", salt, 64, { N: 32768, r: 8, p: 1, maxmem: 128 * 1024 * 1024 }); console.log(`scrypt$1$32768$8$1$${salt.toString("base64url")}$${key.toString("base64url")}`)')
        cat > apps/api/.env <<EOF
        NODE_ENV=test
        PORT=3333
        INSTANCE_ID=bespoke-local
        COMMERCE_STORAGE=file
        DATABASE_URL=mysql://test:test@127.0.0.1:3306/test
        SESSION_SECRET=ci-session-secret-012345678901234567890123456789
        CSRF_SECRET=ci-csrf-secret-012345678901234567890123456789
        ADMIN_EMAIL=admin@example.com
        ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
        ADMIN_SESSION_TTL_MINUTES=480
        CORS_ORIGINS=http://localhost:5173,http://localhost:5174
        TRUSTED_HOSTS=localhost,127.0.0.1
        LOG_LEVEL=warn
        MERCADO_PAGO_ACCESS_TOKEN=TEST-ci-token
        MERCADO_PAGO_WEBHOOK_SECRET=ci-webhook-secret
        WHATSAPP_STORE_PHONE=5511999999999
        PUBLIC_API_URL=http://127.0.0.1:3333
        PUBLIC_WEB_URL=http://localhost:5173
        UPLOADS_DIR=storage/bespoke-local/uploads
        EOF
        cat > apps/control-api/.env <<'EOF'
        NODE_ENV=test
        CONTROL_PORT=3340
        CONTROL_STORAGE=file
        CONTROL_DATA_FILE=../../storage/control-plane/instances.json
        CONTROL_INSTANCES_ROOT=../..
        CONTROL_SESSION_SECRET=ci-control-session-secret-0123456789
        CONTROL_CSRF_SECRET=ci-control-csrf-secret-0123456789
        CONTROL_ADMIN_EMAIL=admin@example.com
        CONTROL_ADMIN_PASSWORD_HASH=ci-control-test-password-hash
        CONTROL_ADMIN_SESSION_TTL_MINUTES=480
        CONTROL_CORS_ORIGINS=http://localhost:5175
        CONTROL_PUBLIC_URL=http://localhost:5175
        CONTROL_TRUSTED_HOSTS=localhost,127.0.0.1
        LOG_LEVEL=warn
        EOF
        printf 'VITE_API_BASE_URL=http://127.0.0.1:3333\n' > apps/web/.env
        printf 'VITE_API_BASE_URL=http://127.0.0.1:3333\n' > apps/admin/.env
        printf 'VITE_CONTROL_API_BASE_URL=http://127.0.0.1:3340\n' > apps/control/.env
    - name: Build applications
      run: npm run build
    - name: Start local services
      shell: bash
      run: |
        npm run dev:api > /tmp/bespoke-api.log 2>&1 &
        npm run dev:control-api > /tmp/bespoke-control-api.log 2>&1 &
        npm run dev:web > /tmp/bespoke-web.log 2>&1 &
        npm run dev:admin > /tmp/bespoke-admin.log 2>&1 &
        npm run dev:control > /tmp/bespoke-control.log 2>&1 &
        node --input-type=module <<'EOF'
        const urls = [
          "http://127.0.0.1:3333/health/live",
          "http://127.0.0.1:3340/health/live",
          "http://127.0.0.1:5173",
          "http://127.0.0.1:5174",
          "http://127.0.0.1:5175",
        ];
        const deadline = Date.now() + 60000;
        while (Date.now() < deadline) {
          const results = await Promise.all(urls.map(async (url) => {
            try { return (await fetch(url)).ok; } catch { return false; }
          }));
          if (results.every(Boolean)) process.exit(0);
          await new Promise((resolve) => setTimeout(resolve, 1000));
        }
        console.error("Local services did not become ready in time.");
        process.exit(1);
        EOF
    - name: Run Playwright tests
      run: npx playwright test --project=chromium --timeout=30000
    - name: Show service logs on failure
      if: failure()
      run: cat /tmp/bespoke-*.log
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
